# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "fmt", name = "vp fmt", entry = "vp fmt", language = "system", pass_filenames = false, priority = 0 },
  { id = "lint", name = "vp lint", entry = "vp lint", language = "system", pass_filenames = false, priority = 10 },
  { id = "lint-devtools", name = "vp lint:devtools", entry = "vp run lint:devtools", language = "system", pass_filenames = false, priority = 10 },
  { id = "typecheck", name = "vp typecheck", entry = "vp run typecheck", language = "system", pass_filenames = false, priority = 10 },
  { id = "test", name = "vp test", entry = "vp run test", language = "system", pass_filenames = false, priority = 20 },
]
