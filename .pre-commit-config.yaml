repos:
  - repo: local
    hooks:
      - id: fmt
        name: vp fmt
        entry: vp run fmt
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: test
        name: vp test
        entry: vp run test
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: vp lint
        entry: vp run lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-devtools
        name: vp lint:devtools
        entry: vp run lint:devtools
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck
        name: vp typecheck
        entry: vp run typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]
