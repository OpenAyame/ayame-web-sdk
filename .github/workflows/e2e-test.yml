name: e2e-test

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  schedule:
    # UTC 時間で毎日 2:00 (JST で 11:00) に実行、月曜日から金曜日
    - cron: "0 2 * * 1-5"

jobs:
  e2e_test_job:
    strategy:
      matrix:
        node-version: ["22", "24"]
        browser: ["chromium"]
    env:
      VITE_AYAME_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      VITE_AYAME_ROOM_ID_PREFIX: ${{ secrets.TEST_ROOM_ID_PREFIX }}
      VITE_AYAME_SIGNALING_KEY: ${{ secrets.TEST_SIGNALING_KEY }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: vp install
      - run: vp build
      - run: vp exec playwright install ${{ matrix.browser }} --with-deps
      - run: vp exec playwright test --project=${{ matrix.browser }}
        env:
          VITE_AYAME_ROOM_NAME: ${{ matrix.node-version }}

  slack_notify:
    needs: [e2e_test_job]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
