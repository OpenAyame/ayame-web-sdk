name: CI

on:
  push:
    branches:
      - develop
      - "feature/*"
      - "releases/*"
jobs:
  ci_job:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: vp install
      - run: vp build
        env:
          CI: true
      - run: vp lint
        env:
          CI: true
      # devtools の vp lint --type-aware は CI (Linux) で実行できない。
      #
      # devtools は vp workspace 経由で @open-ayame/ayame-web-sdk に依存しており、
      # vp install 時に devtools/node_modules/@open-ayame/ayame-web-sdk がルートへの
      # シンボリックリンクとして作成される。
      #
      # vp lint --type-aware の内部で使われる tsgolint (typescript-go ベース) が、
      # このシンボリックリンク経由での型解決に失敗する。
      #
      # 回避策: CI では devtools の lint を --type-aware なしで実行する。
      # type-aware ルールはローカルの pre-commit でチェックする。
      - run: vp run lint:devtools:ci
        env:
          CI: true
      - run: vp run typecheck
        env:
          CI: true

  slack_notify:
    needs: [ci_job]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
