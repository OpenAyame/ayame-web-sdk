name: CI

on:
  push:
    branches:
      - develop
      - "feature/*"
      - "releases/*"
jobs:
  ci_job:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run build
        env:
          CI: true
      - run: pnpm run lint
        env:
          CI: true
      - run: cd devtools && oxlint
        env:
          CI: true
      - run: pnpm run typecheck
        env:
          CI: true
