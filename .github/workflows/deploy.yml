name: GitHub Pages Deploy

on:
  push:
    branches: ["develop"]

  workflow_dispatch:

jobs:
  deploy_job:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
        with:
          node-version: "24"
      - run: vp install --frozen-lockfile
      - run: vp build
      - name: Build devtools
        run: vp build --config devtools/vite.config.ts
      - name: Build typedoc
        run: vp run build:typedoc
      - name: copy
        run: |
          mkdir -p ./output/devtools
          cp -r ./typedoc ./output/typedoc
          cp -r ./devtools/dist/* ./output/devtools
          cp -r ./devtools/dist/assets ./output/devtools/assets
      - name: Upload files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./output

  deploy:
    needs: deploy_job
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  slack_notify:
    needs: [deploy_job, deploy]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
