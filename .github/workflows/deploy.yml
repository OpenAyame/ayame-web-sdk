name: GitHub Pages Deploy

on:
  push:
    branches: ["develop"]

  workflow_dispatch:

jobs:
  deploy_job:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - run: pnpm install
      - run: pnpm build
      - name: Build devtools
        run: pnpm build:devtools
      - name: Build typedoc
        run: pnpm build:typedoc
      - name: copy
        run: |
          mkdir -p ./output/devtools
          cp -r ./typedoc ./output/typedoc
          cp -r ./devtools/dist/* ./output/devtools
          cp -r ./devtools/dist/assets ./output/devtools/assets
      - name: Upload files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./output
      - name: Slack Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: media-processors
          SLACK_COLOR: danger
          SLACK_TITLE: Failure test
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  deploy:
    needs: deploy_job
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
